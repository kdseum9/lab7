
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "refs/pull/${PR_NUMBER}/head"

          excluded=(
            ':(exclude,glob)**/*.lock'
            ':(exclude,glob)**/dist/**'
            ':(exclude,glob)**/generated/**'
          )

          while IFS= read -r binary_file; do
            if [ -n "$binary_file" ]; then
              excluded+=(":(exclude,literal)$binary_file")
            fi
          done < <(
            git diff --no-renames --numstat \
              "$BASE_SHA...FETCH_HEAD" -- . "${excluded[@]}" |
            awk -F '\t' '$1 == "-" && $2 == "-" {print $3}'
          )

          git diff --no-renames --no-color --no-ext-diff --no-textconv \
            "$BASE_SHA...FETCH_HEAD" -- . "${excluded[@]}" > diff.txt

      - name: Run AI review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node review.js diff.txt > review.md

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
