name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "refs/pull/${PR_NUMBER}/head"

          excluded=(
            ':(exclude,glob)**/*.lock'
            ':(exclude,glob)**/dist/**'
            ':(exclude,glob)**/generated/**'
          )
          while IFS= read -r binary_file; do
            if [ -n "$binary_file" ]; then
              excluded+=(":(exclude,literal)$binary_file")
            fi
          done < <(
            git diff --no-renames --numstat \
              "$BASE_SHA...FETCH_HEAD" -- . "${excluded[@]}" |
            awk -F '\t' '$1 == "-" && $2 == "-" {print $3}'
          )

          git diff --no-renames --no-color --no-ext-diff --no-textconv \
            "$BASE_SHA...FETCH_HEAD" -- . "${excluded[@]}" > diff.txt

      - name: Run AI review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node review.js diff.txt > review.md

      - name: Post PR review and inline comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            const body = fs.readFileSync('review.md', 'utf8');

            await github.rest.issues.createComment({
              owner, repo, issue_number: pull_number, body
            });

            if (!fs.existsSync('review-result.json')) return;
            const review = JSON.parse(fs.readFileSync('review-result.json', 'utf8'));
            if (!Array.isArray(review.comments) || review.comments.length === 0) return;

            const comments = review.comments.map(comment => ({
              path: comment.file,
              line: comment.line,
              side: 'RIGHT',
              body: `**${comment.severity.toUpperCase()}: ${comment.message}**\n\n${comment.rule ? `Пункт инструкции: ${comment.rule}\n\n` : ''}Причина: ${comment.reason}`
            }));

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                commit_id: context.payload.pull_request.head.sha,
                event: 'COMMENT',
                body: 'AI Code Review: замечания привязаны к строкам изменённых файлов.',
                comments
              });
            } catch (error) {
              core.warning(`Не удалось добавить inline-комментарии: ${error.message}`);
              core.warning('Общий комментарий со строками уже опубликован выше.');
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Evaluate test PR
        if: github.event.pull_request.number == 10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python evaluate_review.py --out "evaluation-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Save evaluation evidence
        if: always() && github.event.pull_request.number == 10
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review-result.json
            review.md
            diff.txt
            evaluation-*.json
          if-no-files-found: warn
